<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>JelE Clipper</title>
<style>
html,body{margin:0;height:100%;background:#0b1020;color:#e5e7eb;font:500 14px system-ui,Segoe UI,sans-serif}
.w{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
img{width:88px;height:88px;border-radius:22px;box-shadow:0 10px 40px rgba(255,146,0,.25)}
b{font-size:22px;letter-spacing:.02em}.d{color:#94a3b8;font-size:13px}
.bar{width:180px;height:4px;border-radius:4px;background:#1f2937;overflow:hidden}.bar i{display:block;width:40%;height:100%;background:#ff9200;border-radius:4px;animation:m 1.1s ease-in-out infinite}
@keyframes m{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
</style></head>
<body><div class="w"><img src="icon.png" alt=""><b>JelE Clipper</b><div class="bar"><i></i></div><div class="d" id="d">Starting…</div></div>
<script>
let n=0; const go=()=>fetch('http://localhost:8765/api/status',{mode:'no-cors',cache:'no-store'}).then(()=>{ location.href='http://localhost:8765/'; }).catch(()=>{ n++; if(n>25) document.getElementById('d').textContent='Still starting, hang on…'; setTimeout(go,400); });
go();
</script></body></html>
