name: Release

# Makes a release by itself as soon as clipper.py has a new version.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      created: ${{ steps.v.outputs.exists == '0' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          V=$(grep -m1 -oP "^VERSION = '\K[0-9.]+" JelE/clipper/clipper.py)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; else echo "exists=0" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Safety check
        if: steps.v.outputs.exists == '0'
        run: |
          test ! -e JelE/mascotte/config.js || { echo "config.js does not belong in the repository"; exit 1; }
          if grep -rIEn "eyJ[A-Za-z0-9_-]{30,}\.|ghp_[A-Za-z0-9]{20,}|github_pat_|sk-[A-Za-z0-9]{24,}|@gmail\.com|oauth:[a-z0-9]{20,}|streamelements\.com/overlay/[0-9a-f]{24}|\{[0-9.]+\}\.\{[0-9a-f-]{36}\}" JelE; then echo "There seems to be a secret or email address in the files"; exit 1; fi

      - name: Make zip and release notes
        if: steps.v.outputs.exists == '0'
        run: |
          rm -rf JelE/clipper/tests
          zip -qr JelE_update.zip JelE -x "*/__pycache__/*" "*/data/*"
          python3 - <<'PY'
          import re
          s = open('JelE/clipper/CHANGELOG.md', encoding='utf-8').read()
          top = re.split(r'(?m)^## ', s)[1]
          body = top.split('\n', 1)[1].strip()
          body += "\n\n**Install:** download JelE_update.zip, extract it over C:\\ and start the Clipper. On 6.0 or newer you can also update with one click through Settings > Updates.\n\n**New install:** download JelE_Clipper_Setup.exe (it can take a few minutes after the release before it is there). Windows may warn that the app is unknown: click More info > Run anyway."
          open('notes.md', 'w', encoding='utf-8').write(body)
          PY

      - name: Create release
        if: steps.v.outputs.exists == '0'
        run: gh release create "v${{ steps.v.outputs.version }}" JelE_update.zip --target "$GITHUB_SHA" --title "JelE Clipper ${{ steps.v.outputs.version }}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  setup:
    # builds JelE_Clipper_Setup.exe on a clean Windows machine, installs it there as a test, and adds it to the release
    needs: release
    if: needs.release.outputs.created == '1'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gather the files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory build | Out-Null
          Copy-Item -Recurse JelE/clipper build/clipper
          Remove-Item -Recurse -Force build/clipper/tests -ErrorAction SilentlyContinue
          $py = '3.12.10'
          Invoke-WebRequest "https://www.python.org/ftp/python/$py/python-$py-embed-amd64.zip" -OutFile py.zip
          Expand-Archive py.zip build/clipper/python
          # its own Python: find packages (site) and the Clipper's own files (..)
          Set-Content build/clipper/python/python312._pth "python312.zip`r`n.`r`n..`r`nimport site" -NoNewline
          Invoke-WebRequest https://bootstrap.pypa.io/get-pip.py -OutFile build/get-pip.py

      - name: Build the setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DMyVersion=${{ needs.release.outputs.version }}" "/DSrc=$PWD\build" JelE/clipper/installer/jele_setup.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Test it on this clean Windows machine
        shell: pwsh
        run: |
          $setup = 'JelE/clipper/installer/Output/JelE_Clipper_Setup.exe'
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\JelETest','/LOG=setup_test.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content setup_test.log -Tail 40; exit 1 }
          Get-Content C:\JelETest\clipper\data\setup.log -Tail 15
          $c = Start-Process C:\JelETest\clipper\python\python.exe -ArgumentList 'clipper.py','--no-browser' -WorkingDirectory C:\JelETest\clipper -PassThru -RedirectStandardOutput run.log -RedirectStandardError run_err.log
          $ok = $false
          foreach ($i in 1..60) { Start-Sleep 2; try { Invoke-WebRequest http://localhost:8765/api/status -UseBasicParsing | Out-Null; $ok = $true; break } catch {} }
          if ($ok) { foreach ($u in '/', '/api/check', '/api/selftest') { Invoke-WebRequest "http://localhost:8765$u" -UseBasicParsing | Out-Null } }
          Get-Content run.log -Tail 20; Get-Content run_err.log -Tail 20
          Stop-Process -Id $c.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Host 'The installed Clipper does not start'; exit 1 }
          $u = Start-Process C:\JelETest\unins000.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait -PassThru
          Write-Host "uninstall code $($u.ExitCode)"

      - name: Add it to the release
        shell: pwsh
        run: gh release upload "v${{ needs.release.outputs.version }}" JelE/clipper/installer/Output/JelE_Clipper_Setup.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
