name: Local AI engine

# Takes the official llama.cpp build for Windows (Vulkan: AMD, Intel and NVIDIA graphics cards, falls back to the processor),
# keeps llama-server and its files, and puts it on a separate pre-release. The Clipper downloads it itself when you click
# "Install local AI" (Settings > Captions). Before that it is tested on Linux with the real model. Started by hand.
on:
  workflow_dispatch:
    inputs:
      size:
        description: 'Which model to test: small (1 GB) or smart (4.7 GB)'
        default: 'small'

permissions:
  contents: write

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: engine-llama
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the newest llama.cpp build
        run: |
          set -e
          gh api 'repos/ggml-org/llama.cpp/releases?per_page=40' > rel.json
          python3 - <<'EOF'
          import json, re
          rel = json.load(open('rel.json'))
          for r in rel:
              names = [a['name'] for a in r.get('assets', [])]
              win = [n for n in names if re.search(r'win', n, re.I) and re.search(r'vulkan', n, re.I) and re.search(r'x64', n, re.I) and n.endswith('.zip')]
              lnx = [n for n in names if re.search(r'ubuntu', n, re.I) and re.search(r'x64', n, re.I) and not re.search(r'vulkan|rocm|cuda|sycl|s390|arm', n, re.I) and re.search(r'\.(zip|tar\.gz)$', n)]
              if win and lnx:
                  open('ver.txt', 'w').write(r['tag_name']); open('win.txt', 'w').write(win[0]); open('lnx.txt', 'w').write(lnx[0])
                  print('llama.cpp', r['tag_name'], win[0], lnx[0]); break
          else:
              raise SystemExit('no release with a Windows Vulkan and a Linux build found')
          EOF
          WIN=$(cat win.txt); LNX=$(cat lnx.txt)
          gh release download --repo ggml-org/llama.cpp "$(cat ver.txt)" -p "$WIN" -p "$LNX"
          mkdir -p win lnx
          unzip -q "$WIN" -d win
          case "$LNX" in *.zip) unzip -q "$LNX" -d lnx ;; *) tar xzf "$LNX" -C lnx ;; esac
          mkdir pkg
          find win -type f \( -name 'llama-server.exe' -o -name '*.dll' \) -exec cp {} pkg/ \;
          find win -iname 'LICENSE*' -exec cp {} pkg/LICENSE-llama.cpp.txt \; -quit || true
          ls -la pkg
          test -f pkg/llama-server.exe

      - name: Test with the real model (Linux build, processor)
        run: |
          set -e
          pip install -q numpy pillow websocket-client
          cd JelE/clipper
          mkdir -p engine/llama data/models
          BIN=$(dirname "$(find ../../lnx -name llama-server -type f | head -1)")
          cp -a "$BIN"/. engine/llama/
          chmod +x engine/llama/llama-server
          if [ "${{ inputs.size }}" = "smart" ]; then
            curl -sSL -o data/models/Qwen2.5-7B-Instruct-Q4_K_M.gguf https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf
          else
            curl -sSL -o data/models/qwen2.5-1.5b-instruct-q4_k_m.gguf https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
          fi
          ls -la data/models engine/llama | head -40
          LLM_SIZE=${{ inputs.size }} LD_LIBRARY_PATH=$PWD/engine/llama python tests/llm_ci.py

      - name: Publish
        run: |
          set -e
          cd pkg && zip -q -r ../llama_win64.zip . && cd ..
          ls -la llama_win64.zip
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --prerelease --latest=false --title "Local AI engine (llama.cpp $(cat ver.txt))" --notes "Used by JelE Clipper for the optional local AI model (titles and editor commands). The app downloads it itself (Settings > Captions > Local AI). This is not an app version."
          gh release upload "$TAG" llama_win64.zip --clobber
